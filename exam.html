<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dec Academic CBT Hub</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="logo1.png">
    <!-- ✅ KATEX FOR MATH FORMULAS + AUTO-RENDER CONFIG -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"
        onload="renderMathInElement(document.body, {
            delimiters: [
                {left: '\\(', right: '\\)', display: false},
                {left: '\\[', right: '\\]', display: true}
            ],
            throwOnError: false
        });">
    </script>
</head>
<body>

<!-- 📝 EXAM INTERFACE -->
<div class="exam-course-header">
    <h4 id="examCourseName">📚 EXAMINATION</h4>
</div>

<header class="exam-header">
    <div class="exam-user">
        <img id="examPic" src="" alt="Profile">
        <div>
            <h4 id="examFirstname"></h4>
            <small id="examMatric"></small>
        </div>
    </div>
    <div class="timer-box" id="timer">00:00</div>
    <button class="calc-toggle" id="calcToggleBtn" onclick="toggleCalc()">🧮 Calculator</button>
</header>

<main class="exam-container">
    <div class="question-card">
        <div id="questionBox"></div>
        <div id="instantFeedback" class="feedback-box" style="display:none;"></div>
    </div>

    <!-- NAVIGATION BUTTONS -->
    <div class="nav-buttons">
        <button id="prevBtn" onclick="prevQ()" disabled>← Previous</button>
        <button id="nextBtn" onclick="nextQ()">Next ➡️</button>
    </div>
    
    <!-- QUESTION NAVIGATION -->
    <div class="q-nav" id="qNav"></div>

    <button class="submit-btn" onclick="confirmSubmit()">✅ Submit Exam</button>
</main>

<!-- 🧮 ENHANCED SCIENTIFIC CALCULATOR -->
<div id="calcPanel" class="calc-panel">
    <h3 style="text-align:center;margin-bottom:1rem;">🧮 Scientific Calculator (Degrees)</h3>
    <input type="text" id="calcDisplay" readonly placeholder="0" class="calc-display">
    <div class="calc-grid">
        <!-- Row 1 -->
        <button onclick="calcInput('(')">(</button>
        <button onclick="calcInput(')')">)</button>
        <button onclick="calcInput('^')">xⁿ</button>
        <button onclick="calcInput('/')">÷</button>
        <button onclick="calcClear()">C</button>
        
        <!-- Row 2 -->
        <button onclick="calcInput('7')">7</button>
        <button onclick="calcInput('8')">8</button>
        <button onclick="calcInput('9')">9</button>
        <button onclick="calcInput('*')">×</button>
        <button onclick="calcBack()">⌫</button>
        
        <!-- Row 3 -->
        <button onclick="calcInput('4')">4</button>
        <button onclick="calcInput('5')">5</button>
        <button onclick="calcInput('6')">6</button>
        <button onclick="calcInput('-')">−</button>
        <button onclick="calcInput('sqrt(')">√</button>
        
        <!-- Row 4 -->
        <button onclick="calcInput('1')">1</button>
        <button onclick="calcInput('2')">2</button>
        <button onclick="calcInput('3')">3</button>
        <button onclick="calcInput('+')">+</button>
        <button onclick="calcInput('cbrt(')">∛</button>
        
        <!-- Row 5 -->
        <button onclick="calcInput('0')">0</button>
        <button onclick="calcInput('.')">.</button>
        <button onclick="calcInput('pi')">π</button>
        <button onclick="calcInput('e')">e</button>
        <button onclick="calcEquals()">=</button>
        
        <!-- Row 6 — Scientific Functions -->
        <button onclick="calcInput('sin(')">sin</button>
        <button onclick="calcInput('cos(')">cos</button>
        <button onclick="calcInput('tan(')">tan</button>
        <button onclick="calcInput('exp(')">eˣ</button>
        <button onclick="calcInput('ln(')">ln</button>
        
        <!-- Row 7 — More Functions -->
        <button onclick="calcInput('log(')">log₁₀</button>
        <button onclick="calcInput('asin(')">sin⁻¹</button>
        <button onclick="calcInput('acos(')">cos⁻¹</button>
        <button onclick="calcInput('atan(')">tan⁻¹</button>
        <button onclick="calcInput('log2(')">log₂</button>
    </div>
</div>

<script src="exam.js"></script>
</body>
</html>
